# ==========================================================
# CloudData - en entorno cloud azure (mi entorno local)
#andres espitia ramirez
# Contenedores:
#   db              PostgreSQL: ventas consolidadas y cargas
#   carga-limpieza  Microservicio 1  -> http://localhost:8000/docs
#   reportes        Microservicio 2  -> http://localhost:8001/docs
# ==========================================================

name: clouddata

#seguridad de los microservicos 
x-seguridad: &seguridad
  read_only: true              
  tmpfs:
    - /tmp                     
  security_opt:
    - no-new-privileges:true   
  cap_drop:
    - ALL                     
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clouddata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clouddata_local}
      POSTGRES_DB: ${POSTGRES_DB:-clouddata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend               
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  carga-limpieza:
    <<: *seguridad
    build: ./services/carga-limpieza
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clouddata}:${POSTGRES_PASSWORD:-clouddata_local}@db:5432/${POSTGRES_DB:-clouddata}
      DATA_DIR: /data
      CARGA_INICIAL_DIR: /samples
    volumes:
      - archivos:/data                    
      - ./data-samples:/samples:ro        
    ports:
      - "${CARGA_PORT:-8000}:8000"
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  reportes:
    <<: *seguridad
    build: ./services/reportes
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clouddata}:${POSTGRES_PASSWORD:-clouddata_local}@db:5432/${POSTGRES_DB:-clouddata}
    ports:
      - "${REPORTES_PORT:-8001}:8000"
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      carga-limpieza:
        condition: service_healthy

networks:
  frontend:                    
  backend:
    internal: true             

volumes:
  pgdata:                      
  archivos:                   